/* ---------- bar navigasi bawah (mobile) ---------- */
.bn{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -8px 24px -12px #0004;padding:6px 6px calc(6px + env(safe-area-inset-bottom));align-items:flex-end;justify-content:space-around}

.bn button.pc{background:none;padding:0 2px 4px;color:var(--tx)}

.bn .cb svg{width:28px;height:28px;stroke:var(--act);stroke-width:2.4}
.bn button.pc:active{transform:none}.bn button.pc:active .cb{transform:scale(.92)}

function drill(i,j){const M=S.stM,rk=i>=0?M.rows[i].k:null,cn=j>=0?M.cols[j]:null;
 const L=S.siswa.filter(s=>(rk===null||M.rk(s)===rk)&&(cn===null||M.ck(s)===cn)).sort((a,b)=>a.kelas.localeCompare(b.kelas,'id',{numeric:true})||a.nama.localeCompare(b.nama,'id'));
 modal(`<h3>${rk===null?'Semua siswa':(M.byTk?'Kelas ':'Rombel ')+esc(rk)}${cn?' · '+esc(cn):''}</h3><p style="margin:0 0 8px;color:var(--mu)">${L.length} siswa</p><div class="tw" style="max-height:55vh;overflow:auto"><table><tr><th>No</th><th>Nama</th><th>NISN</th><th>JK</th><th>Agama</th><th>Kelas</th></tr>${L.map((s,x)=>`<tr><td>${x+1}</td><td>${esc(s.nama)}</td><td>${s.nisn}</td><td>${s.jk}</td><td>${esc(s.agama)}</td><td>${s.kelas}</td></tr>`).join('')}</table></div><div class="row"><button class="btn" onclick="closeM()">Tutup</button></div>`,680)}

/* ---------- surat masuk ---------- */
S.srt={list:[],baca:{}};
const unread=()=>S.user&&!isA()?S.srt.list.filter(x=>!(S.srt.baca[x.id]||[]).length).length:0;
function updDot(){const n=unread();['dotS','dotM','dotB'].forEach(i=>{const e=$('#'+i);if(e)e.hidden=!n})}
async function refreshSurat(){try{const r=await api('surat'),j=JSON.stringify(r);if(S.sj!==j){S.sj=j;S.srt=r;updDot();return true}}catch(e){}return false}
setInterval(async()=>{if(!S.user||document.hidden||isA())return;if(await refreshSurat()&&S.view==='surat'&&!$('#mo').innerHTML)render()},60000);
const wkt=w=>tgl(w.slice(0,10))+', '+w.slice(11,16).replace(':','.')+' WIB';
const lnk=(x,t,cb)=>`<a class="btn sm" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer"${cb?` onclick="bc('${x.id}')" onauxclick="bc('${x.id}')"`:''}>${t}</a>`;
function vSurat(){return isA()?vSuratA():vSuratG()}
function vSuratG(){const L=S.srt.list;
 return`<div class="card"><h3>Surat untuk Anda</h3>${L.length?L.map(x=>{const nw=!(S.srt.baca[x.id]||[]).length;return`<div class="sr${nw?' nw':''}"><div class="n"><b>${nw?'<i class="dot"></i> ':''}${esc(x.judul)}</b><br><small style="color:var(--mu)">Dikirim ${wkt(x.waktu)}</small>${x.catatan?`<div class="ct">${esc(x.catatan)}</div>`:''}</div>${lnk(x,'Buka surat ↗',1)}</div>`}).join(''):'<p style="color:var(--mu);margin:0">Belum ada surat untuk Anda.</p>'}</div>`}
function bc(id){if((S.srt.baca[id]||[]).length)return;S.srt.baca[id]=[S.user.id];updDot();api('bacaSurat',{id}).catch(()=>{});setTimeout(()=>{if(S.view==='surat')render()},400)}
function vSuratA(){const G=S.guru.filter(g=>g.id!==S.kepsek),nm=id=>(S.guru.find(g=>g.id===id)||{}).nama||'(guru dihapus)',L=S.srt.list;
 return`<div class="card"><h3>Kirim surat</h3><div class="fm"><input id="sj" placeholder="Judul surat, mis. Surat Tugas Workshop" maxlength="150"><input id="sl" placeholder="Link surat (https://...)" inputmode="url"><small style="color:var(--mu);margin-top:-4px">Link Google Drive otomatis diubah menjadi link unduh langsung.</small><textarea id="sc" placeholder="Catatan (opsional)" maxlength="500" style="min-height:70px"></textarea>
 <details class="dd"><summary id="sm">Pilih penerima (0 dipilih)</summary><div class="ddl"><label><input type="checkbox" id="pa" onchange="penAll(this.checked)"> <b>Pilih semua guru</b></label>${G.map(g=>`<label><input type="checkbox" class="pn" value="${esc(g.id)}" onchange="penCnt()"> ${esc(g.nama)}</label>`).join('')}</div></details>
 <div><button class="btn" id="sk" onclick="kirimS()">Kirim</button></div></div></div>
 <div class="card"><h3>Surat terkirim</h3>${L.length?L.map(x=>{const b=x.pen.filter(p=>(S.srt.baca[x.id]||[]).includes(p));return`<div class="sr"><div class="n"><b>${esc(x.judul)}</b><br><small style="color:var(--mu)">Dikirim ${wkt(x.waktu)}</small>${x.catatan?`<div class="ct">${esc(x.catatan)}</div>`:''}<details style="margin-top:6px"><summary style="cursor:pointer">Dibaca ${b.length} dari ${x.pen.length} penerima</summary><div class="ct">${x.pen.map(p=>`<div>${b.includes(p)?'✓':'•'} ${esc(nm(p))}</div>`).join('')}</div></details></div><div class="col">${lnk(x,'Buka ↗',0)}<button class="btn sec sm" onclick="hapusS('${x.id}')">Hapus</button></div></div>`}).join(''):'<p style="color:var(--mu);margin:0">Belum ada surat terkirim.</p>'}</div>`}
function penCnt(){const a=[...document.querySelectorAll('.pn')],n=a.filter(e=>e.checked).length;$('#sm').textContent='Pilih penerima ('+n+' dipilih)';$('#pa').checked=n===a.length&&n>0}
function penAll(c){document.querySelectorAll('.pn').forEach(e=>e.checked=c);penCnt()}
async function kirimS(){const pen=[...document.querySelectorAll('.pn:checked')].map(e=>e.value),judul=$('#sj').value.trim(),link=$('#sl').value.trim();
 if(!judul||!link||!pen.length)return toast('Isi judul, link, dan pilih minimal satu penerima.',1);
 if(!/^https?:\/\/\S+$/i.test(link))return toast('Link harus diawali http:// atau https://',1);
 const b=$('#sk');b.disabled=true;
 try{const r=await api('kirimSurat',{judul,link,catatan:$('#sc').value,pen});toast('Surat terkirim ke '+pen.length+' guru.'+(r&&r.conv?' Link Drive diubah menjadi link unduh.':''));await refreshSurat();render()}catch(e){toast(e.message,1);b.disabled=false}}
async function hapusS(id){if(!confirm('Hapus surat ini dari semua penerima?'))return;try{await api('hapusSurat',{id});await refreshSurat();render();toast('Surat dihapus.')}catch(e){toast(e.message,1)}}

/* ---------- setting ---------- */
function vSet0(){const a=isA();return`${needPin()?LOCKBN:''}<div class="card" style="max-width:420px"><h3>Ganti ${a?'password':'PIN'}</h3><div class="row"><input id="po" type="password" placeholder="${a?'Password':'PIN'} lama" style="flex:1"></div><div class="row"><input id="pn" type="password" placeholder="${a?'Password baru (min. 6 karakter)':'PIN baru (4-8 angka)'}" ${a?'':'inputmode="numeric"'} style="flex:1"></div><div class="row"><input id="pn2" type="password" placeholder="Ulangi ${a?'password':'PIN'} baru" ${a?'':'inputmode="numeric"'} style="flex:1"></div><button class="btn" onclick="chPin()">Simpan</button><p style="color:var(--mu);font-size:13px">${a?'':'Pilih PIN yang tidak mudah ditebak. '}Setelah diganti, gunakan yang baru saat masuk.</p></div>`}
/* ---------- sinkron data dengan spreadsheet ---------- */
const dkey=()=>JSON.stringify([S.siswa,S.guru,S.ks,S.kepsek]);
async function refreshData(quiet){
 try{const r=await api('boot'),before=dkey();['siswa','guru','kepsek','ks','kelas'].forEach(k=>S[k]=r[k]);S.dataT=Date.now();
  if(before!==dkey()&&['dash','guru','siswa','kepsek','surat'].includes(S.view)){const ae=document.activeElement;if(!(quiet&&ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)&&$('#v').contains(ae)))render()}
  return true}catch(e){if(!quiet)toast(e.message,1);return false}}
const dbBar=()=>`<div class="sri" style="margin-bottom:10px"><button onclick="dbReload(this)" title="Ambil ulang data dari spreadsheet">🔄</button> Database: <b>${S.siswa.length}</b> siswa · <b>${S.guru.length}</b> guru · diperbarui ${new Date(S.dataT||Date.now()).toTimeString().slice(0,5)}</div>`;
async function dbReload(b){b.classList.add('spin');const ok=await refreshData(false);if(ok){render();toast('Data diperbarui dari spreadsheet.')}else b.classList.remove('spin')}
setInterval(()=>{if(S.user&&!document.hidden&&Date.now()-(S.dataT||0)>120000)refreshData(true)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user&&Date.now()-(S.dataT||0)>60000)refreshData(true)});

/* ---------- sapaan guru (+ ucapan ulang tahun) ---------- */
const needPin=()=>!!(S.user&&S.user.role==='guru'&&S.user.def);
function cleanNama(n){let s=String(n||'').split(',')[0].trim().replace(/^((Dr|Dra|Drs|Ir|Prof|Hj|Hi|H)\.?\s+)+/i,'');const w=s.split(/\s+/);while(w.length>1&&/^([A-Za-z]{1,4}\.){1,}[A-Za-z]{0,4}\.?$/.test(w[w.length-1]))w.pop();return w.join(' ')}
const salam=(h=new Date().getHours())=>h>=4&&h<11?'pagi':h>=11&&h<15?'siang':h>=15&&h<18?'sore':'malam';
const sapa=g=>/^l/i.test(g.jk||'')?'Bapak Guru':/^p/i.test(g.jk||'')?'Ibu Guru':'Bapak/Ibu Guru';
const isoL=t=>{t=String(t||'').trim();let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m){let d=+m[1],mo=+m[2];if(mo>12){const z=d;d=mo;mo=z}return m[3]+'-'+pad(mo)+'-'+pad(d)}return''};
function lahirGuru(g){let i=isoL(g.lahir);if(i)return{m:+i.slice(5,7),d:+i.slice(8)};const n=String(g.nip||'').replace(/\D/g,'');
 if(n.length>=18){const y=+n.slice(0,4),m=+n.slice(4,6),d=+n.slice(6,8);if(y>=1900&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31)return{m,d}}return null}
function ultah(g,t=new Date()){const b=lahirGuru(g);if(!b)return false;const y=t.getFullYear(),kab=y%4===0&&(y%100!==0||y%400===0);let d=b.d;if(b.m===2&&d===29&&!kab)d=28;return t.getMonth()+1===b.m&&t.getDate()===d}
const CAKE=`<svg class="cake" viewBox="0 0 230 150" aria-hidden="true"><g class="bl"><ellipse cx="26" cy="44" rx="15" ry="19" fill="#ffd166"/><path d="M26 63q-4 14 3 30" stroke="#fff" stroke-width="1.5" fill="none" opacity=".8"/></g><g class="bl b2"><ellipse cx="56" cy="28" rx="14" ry="18" fill="#4cc9f0"/><path d="M56 46q4 18-2 40" stroke="#fff" stroke-width="1.5" fill="none" opacity=".8"/></g><g class="bl b3"><ellipse cx="204" cy="40" rx="15" ry="19" fill="#ff6b8b"/><path d="M204 59q-4 16 2 36" stroke="#fff" stroke-width="1.5" fill="none" opacity=".8"/></g><g class="bl b2"><ellipse cx="176" cy="26" rx="13" ry="17" fill="#80ed99"/><path d="M176 43q4 18-2 42" stroke="#fff" stroke-width="1.5" fill="none" opacity=".8"/></g>
<ellipse cx="115" cy="142" rx="62" ry="6" fill="#00000026"/><rect x="64" y="104" width="102" height="34" rx="8" fill="#ff8fb8"/><rect x="76" y="78" width="78" height="30" rx="8" fill="#fff0f5"/><path d="M64 112q8 11 17 0t17 0t17 0t17 0t17 0t17 0v-10H64z" fill="#fff"/><path d="M76 86q6 9 13 0t13 0t13 0t13 0t13 0v-8H76z" fill="#ffd1e3"/>
<rect x="94" y="56" width="7" height="24" rx="2" fill="#4cc9f0"/><rect x="112" y="56" width="7" height="24" rx="2" fill="#ffd166"/><rect x="130" y="56" width="7" height="24" rx="2" fill="#80ed99"/><ellipse class="fl" cx="97.5" cy="48" rx="4.5" ry="8" fill="#ffb703"/><ellipse class="fl" cx="115.5" cy="48" rx="4.5" ry="8" fill="#ffb703"/><ellipse class="fl" cx="133.5" cy="48" rx="4.5" ry="8" fill="#ffb703"/><circle cx="97.5" cy="50" r="2" fill="#fff6c9"/><circle cx="115.5" cy="50" r="2" fill="#fff6c9"/><circle cx="133.5" cy="50" r="2" fill="#fff6c9"/></svg>`;
const CONF=['#ffd166','#4cc9f0','#ff6b8b','#80ed99','#fff','#b18cff'].flatMap((c,i)=>[0,1,2].map(j=>`<i class="cf" style="--x:${(i*17+j*6+3)%96}%;--c:${c};--d:${(2.6+((i+j)%4)*.5).toFixed(1)}s;--l:-${((i*3+j)%7)*.6}s"></i>`)).join('');
function greetCard(){if(!S.user||isA())return'';const g=S.guru.find(x=>x.id===S.user.id);if(!g)return'';const nm=esc(cleanNama(g.nama)),b=sapa(g),hari=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 if(ultah(g))return`<div class="gt bday">${CONF}<div class="gtx"><small>${hari}</small><h2>🎉 Selamat Ulang Tahun, ${b} ${nm}!</h2><p>Semoga selalu sehat, bahagia, dan diberkahi. Terima kasih atas dedikasi ${b} untuk anak-anak SD Negeri 101731. Tetap hebat!!!</p></div>${CAKE}</div>`;
 const w=salam();return`<div class="gt ${w}"><div class="gtx"><small>${hari}</small><h2>Selamat ${w} ${b} ${nm} yang hebat!!!</h2></div><span class="gic">${{pagi:'🌅',siang:'☀️',sore:'🌇',malam:'🌙'}[w]}</span></div>`}
const LOCKBN='<div class="al" style="max-width:420px;background:#ffe4e1;color:#9b1c13"><b>🔒 Ganti PIN standar Anda</b><br>Untuk dapat melanjutkan presensi, silakan ganti PIN standar Anda terlebih dahulu. Ini penting demi keamanan data siswa.</div>';



/* ---------- cadangan data (admin) ---------- */
const vSet=()=>vSet0()+(isA()?'<div class="card" style="max-width:420px"><h3>Cadangan data</h3><div id="cdg" style="color:var(--mu)">Memuat…</div></div>':'');
function cdgShow(r){const e=$('#cdg');if(!e)return;const t=r.terakhir;
 e.innerHTML=`<p style="margin:0 0 8px">Cadangan otomatis: <b style="color:${r.aktif?'var(--ac)':'var(--er)'}">${r.aktif?'aktif (tiap tanggal ${r.hari||2}, sekitar pukul 02.00 WIB)':'belum diaktifkan'}</b></p>${r.aktif?'':'<p style="margin:0 0 8px;font-size:13px">Jalankan fungsi <b>pasangJadwalCadangan</b> sekali di Apps Script.</p>'}<p style="margin:0 0 12px">Cadangan terakhir: <b>${t?esc(t.t.replace(/\./,':')):'belum ada'}</b>${t?` · <a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">Buka folder ↗</a>`:''}</p><button class="btn" id="cdb" onclick="cdgNow()">Cadangkan sekarang</button>`}
async function cdgLoad(){if(!isA()||!$('#cdg'))return;try{cdgShow(await api('cadangan'))}catch(e){$('#cdg').textContent=e.message}}
async function cdgNow(){const b=$('#cdb');b.disabled=true;toast('Membuat cadangan, mohon tunggu…');try{cdgShow(await api('cadangkanSekarang'));toast('Cadangan selesai.')}catch(e){toast(e.message,1);b.disabled=false}}

async function chPin(){const nw=$('#pn').value,lock=needPin();if(nw!==$('#pn2').value)return toast('Ulangi PIN/password baru dengan benar.',1);
 try{await api('chPin',{old:$('#po').value,nw});S.user.def=false;$('#po').value=$('#pn').value=$('#pn2').value='';toast(lock?'PIN berhasil diganti. Silakan lanjutkan presensi.':'Berhasil diganti.');if(lock){S.view='dash';await boot()}}catch(e){toast(e.message,1)}}

setRole('guru');names();
(async()=>{const t=ls('tk');if(t){S.token=t;try{await boot()}catch(e){S.token='';ls('tk',null)}}})();
</script>
</body>
</html>
